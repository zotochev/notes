name: deploy

# Every push to main is tested; only a version tag (v1.2.3) is deployed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer one waits for the running one.
    concurrency: deploy
    steps:
      - name: Update the server and restart the service
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/notificator' }}
          DEPLOY_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          # A secret pasted from Windows may carry CR line ends, which ssh does not accept in a key.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              set -e
              cd '$DEPLOY_PATH'
              git fetch --quiet --tags origin
              # Exactly the commit that was tested, not whatever main has become since.
              git checkout --quiet --detach '$DEPLOY_COMMIT'
              .venv/bin/pip install -q -r requirements.txt
              sudo -n systemctl restart notes
              sleep 5
              systemctl is-active notes
            "
